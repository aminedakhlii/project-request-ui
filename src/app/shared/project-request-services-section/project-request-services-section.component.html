<p class="services-loading" *ngIf="configLoading">Loading services…</p>
<div class="services-two-col" *ngIf="!configLoading" [class.mobile-compact-services]="isMobileCompact">
  <div class="col exterior-col">
    <button
      *ngIf="isMobileCompact"
      type="button"
      class="section-accordion-header"
      (click)="toggleMobileExterior()"
      [attr.aria-expanded]="mobileExteriorOpen">
      <span class="section-accordion-label">Exterior Services</span>
      <span class="cat-chevron" [class.expanded]="mobileExteriorOpen">▼</span>
    </button>
    <h4 *ngIf="!isMobileCompact" class="col-title">Exterior Services</h4>
    <div class="section-accordion-body" [class.section-accordion-body--collapsed]="isMobileCompact && !mobileExteriorOpen">
    <ng-container *ngFor="let cat of exteriorConfig; trackBy: trackByCatId">
      <div class="category-block">
        <button type="button" class="cat-header" (click)="toggle(cat.id)" [attr.aria-expanded]="isExpanded(cat.id)">
          <span class="cat-header-main">
            <img *ngIf="cat.logoUrl" class="cat-logo" [src]="cat.logoUrl" [alt]="cat.label" />
            <span class="cat-label">{{ cat.label }}</span>
          </span>
          <span class="cat-chevron" [class.expanded]="isExpanded(cat.id)">▼</span>
        </button>
        <div *ngIf="isExpanded(cat.id)" class="cat-content">

        <select *ngIf="cat.type === 'dropdown'" class="form-control form-select"
          [ngModel]="selections[key(cat.id)]" (ngModelChange)="selections[key(cat.id)] = $event"
          [name]="'ext_'+cat.id">
          <option value="">Select...</option>
          <option *ngFor="let opt of cat.options; trackBy: trackByOptValue" [value]="opt.value">{{ opt.label }}</option>
        </select>

        <div *ngIf="cat.type === 'multicheck'" class="sub-opts">
          <label *ngFor="let it of cat.items; trackBy: trackByItemId" class="sub-opt">
            <input type="checkbox" [ngModel]="selections[key(cat.id, it.id)]" (ngModelChange)="selections[key(cat.id, it.id)] = $event" [name]="'ext_'+cat.id+'_'+it.id">
            {{ it.label }}
          </label>
        </div>

        <div *ngIf="cat.type === 'number_group'" class="number-group">
          <div *ngFor="let it of cat.items; trackBy: trackByItemId" class="number-row">
            <label class="number-label">{{ it.label }}</label>
            <input type="number" min="0" class="form-control number-input"
              [ngModel]="selections[key(cat.id, it.id)]" (ngModelChange)="selections[key(cat.id, it.id)] = $event"
              [name]="'ext_'+cat.id+'_'+it.id" placeholder="0">
            <div *ngIf="it.hasDescription" class="number-row-desc">
              <input type="text" class="form-control desc-input" placeholder="Brief description"
                [ngModel]="selections[key(cat.id, it.id)+'_desc']" (ngModelChange)="selections[key(cat.id, it.id)+'_desc'] = $event"
                [name]="'ext_'+cat.id+'_'+it.id+'_desc'">
            </div>
            <div *ngIf="it.hasCustomerSupplied" class="customer-supplied-row">
              <span class="cs-label">Customer supplied?</span>
              <label class="radio-inline">
                <input type="radio" [name]="'ext_'+cat.id+'_'+it.id+'_cs'" [value]="true"
                  [ngModel]="selections[key(cat.id, it.id)+'_customer_supplied']"
                  (ngModelChange)="selections[key(cat.id, it.id)+'_customer_supplied'] = $event"> Yes
              </label>
              <label class="radio-inline">
                <input type="radio" [name]="'ext_'+cat.id+'_'+it.id+'_cs'" [value]="false"
                  [ngModel]="selections[key(cat.id, it.id)+'_customer_supplied']"
                  (ngModelChange)="selections[key(cat.id, it.id)+'_customer_supplied'] = $event"> No
              </label>
            </div>
          </div>
        </div>
        </div>
      </div>
    </ng-container>
    </div>
  </div>

  <div class="col interior-col">
    <button
      *ngIf="isMobileCompact"
      type="button"
      class="section-accordion-header"
      (click)="toggleMobileInterior()"
      [attr.aria-expanded]="mobileInteriorOpen">
      <span class="section-accordion-label">Interior Services</span>
      <span class="cat-chevron" [class.expanded]="mobileInteriorOpen">▼</span>
    </button>
    <h4 *ngIf="!isMobileCompact" class="col-title">Interior Services</h4>
    <div class="section-accordion-body" [class.section-accordion-body--collapsed]="isMobileCompact && !mobileInteriorOpen">
    <ng-container *ngFor="let cat of interiorConfig; trackBy: trackByCatId">
      <div class="category-block">
        <button type="button" class="cat-header" (click)="toggle(cat.id)" [attr.aria-expanded]="isExpanded(cat.id)">
          <span class="cat-header-main">
            <img *ngIf="cat.logoUrl" class="cat-logo" [src]="cat.logoUrl" [alt]="cat.label" />
            <span class="cat-label">{{ cat.label }}</span>
          </span>
          <span class="cat-chevron" [class.expanded]="isExpanded(cat.id)">▼</span>
        </button>
        <div *ngIf="isExpanded(cat.id)" class="cat-content">

        <select *ngIf="cat.type === 'dropdown'" class="form-control form-select"
          [ngModel]="selections[key(cat.id)]" (ngModelChange)="selections[key(cat.id)] = $event"
          [name]="'int_'+cat.id">
          <option value="">Select...</option>
          <option *ngFor="let opt of cat.options; trackBy: trackByOptValue" [value]="opt.value">{{ opt.label }}</option>
        </select>

        <div *ngIf="cat.type === 'multicheck'" class="sub-opts">
          <label *ngFor="let it of cat.items; trackBy: trackByItemId" class="sub-opt">
            <input type="checkbox" [ngModel]="selections[key(cat.id, it.id)]" (ngModelChange)="selections[key(cat.id, it.id)] = $event" [name]="'int_'+cat.id+'_'+it.id">
            {{ it.label }}
          </label>
        </div>

        <div *ngIf="cat.type === 'number_group'" class="number-group">
          <div *ngFor="let it of cat.items; trackBy: trackByItemId" class="number-row">
            <label class="number-label">{{ it.label }}</label>
            <input type="number" min="0" class="form-control number-input"
              [ngModel]="selections[key(cat.id, it.id)]" (ngModelChange)="selections[key(cat.id, it.id)] = $event"
              [name]="'int_'+cat.id+'_'+it.id" placeholder="0">
            <div *ngIf="it.hasDescription" class="number-row-desc">
              <input type="text" class="form-control desc-input" placeholder="Brief description"
                [ngModel]="selections[key(cat.id, it.id)+'_desc']" (ngModelChange)="selections[key(cat.id, it.id)+'_desc'] = $event"
                [name]="'int_'+cat.id+'_'+it.id+'_desc'">
            </div>
            <div *ngIf="it.hasCustomerSupplied" class="customer-supplied-row">
              <span class="cs-label">Customer supplied?</span>
              <label class="radio-inline">
                <input type="radio" [name]="'int_'+cat.id+'_'+it.id+'_cs'" [value]="true"
                  [ngModel]="selections[key(cat.id, it.id)+'_customer_supplied']"
                  (ngModelChange)="selections[key(cat.id, it.id)+'_customer_supplied'] = $event"> Yes
              </label>
              <label class="radio-inline">
                <input type="radio" [name]="'int_'+cat.id+'_'+it.id+'_cs'" [value]="false"
                  [ngModel]="selections[key(cat.id, it.id)+'_customer_supplied']"
                  (ngModelChange)="selections[key(cat.id, it.id)+'_customer_supplied'] = $event"> No
              </label>
            </div>
          </div>
        </div>

        <div *ngIf="cat.type === 'yn_then_multicheck'" class="yn-then-multicheck">
          <div class="yn-row" *ngIf="cat.supplyMaterialLabel">
            <span class="yn-label">{{ cat.supplyMaterialLabel }}</span>
            <label class="radio-inline"><input type="radio" [name]="'supply_'+cat.id" [value]="true" [ngModel]="selections[key(cat.id)+'_supply']" (ngModelChange)="selections[key(cat.id)+'_supply'] = $event">Yes</label>
            <label class="radio-inline"><input type="radio" [name]="'supply_'+cat.id" [value]="false" [ngModel]="selections[key(cat.id)+'_supply']" (ngModelChange)="selections[key(cat.id)+'_supply'] = $event">No</label>
          </div>
          <div class="sub-opts">
            <label *ngFor="let it of cat.items; trackBy: trackByItemId" class="sub-opt">
              <input type="checkbox" [ngModel]="selections[key(cat.id, it.id)]" (ngModelChange)="selections[key(cat.id, it.id)] = $event" [name]="'int_'+cat.id+'_'+it.id">
              {{ it.label }}
            </label>
          </div>
        </div>
        </div>
      </div>
    </ng-container>
    </div>
  </div>
</div>
